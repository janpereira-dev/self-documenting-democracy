name: Validate Self-Documenting Democracy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/validate_package.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install from GitHub using the standard Skills CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_TELEMETRY: '1'
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          source="$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            source="$GITHUB_REPOSITORY"
          fi
          for selection in en es both; do
            mkdir -p "$RUNNER_TEMP/democracy-smoke-$selection"
            cd "$RUNNER_TEMP/democracy-smoke-$selection"
            editions=(en es)
            if [ "$selection" != both ]; then editions=("$selection"); fi
            skills=()
            for edition in "${editions[@]}"; do
              skills+=("self-documenting-democracy-$edition")
            done
            npx --yes skills@1.7.0 add "$source" --skill "${skills[@]}" --agent codex claude-code --yes
            for skill in "${skills[@]}"; do
              diff -r ".agents/skills/$skill" "$GITHUB_WORKSPACE/skills/$skill"
              diff -r ".claude/skills/$skill" "$GITHUB_WORKSPACE/skills/$skill"
            done
            if [ "$selection" = en ]; then
              test ! -e .agents/skills/self-documenting-democracy-es
            elif [ "$selection" = es ]; then
              test ! -e .agents/skills/self-documenting-democracy-en
            fi
          done
